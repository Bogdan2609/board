[project]
name = "fastapi-quote-api"
version = "0.5.0"
description = "Universal high-performance automotive parts quote engine API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.53,<0.54",
  "httpx[http2]>=0.28,<0.29",
  "pydantic-settings>=2.10,<3",
  "zeep[async]==4.3.3",
  "lxml>=6.1.3,<7",
]

[project.optional-dependencies]
production = [
  "asyncpg>=0.31,<0.32",
  "redis>=6.4,<7",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.13,<0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
